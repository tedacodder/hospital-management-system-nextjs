```yaml
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  quality:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hospital"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospital
      NEXTAUTH_SECRET: github-actions-test-secret-change-this
      NEXTAUTH_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: TestPassword123!
      UPLOAD_DIR: ./uploads
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d hospital; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

  security:
    name: Check for accidentally committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then
            echo "ERROR: A real .env file is tracked by Git."
            echo "Remove it from Git and rotate any exposed credentials."
            exit 1
          fi

      - name: Check for common secret files
        run: |
          if git ls-files | grep -E '(^|/)(\.env\.local|\.env\.production|credentials\.json|service-account.*\.json)$'; then
            echo "ERROR: A potentially sensitive credential file is tracked by Git."
            exit 1
          fi

      - name: Check Git status
        run: git status --short
```
